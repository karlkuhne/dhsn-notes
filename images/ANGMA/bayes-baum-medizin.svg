<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" font-family="sans-serif" font-size="15" fill="none" stroke="#888" stroke-width="1.5">
  <g stroke="#888">
    <line x1="20" y1="170" x2="290" y2="90"/>
    <line x1="20" y1="170" x2="290" y2="250"/>
    <line x1="360" y1="90" x2="620" y2="40"/>
    <line x1="360" y1="90" x2="620" y2="140"/>
    <line x1="360" y1="250" x2="620" y2="200"/>
    <line x1="360" y1="250" x2="620" y2="300"/>
  </g>
  <g fill="#888" stroke="none" text-anchor="middle">
    <text x="130" y="108">P(krank) = 0,01</text>
    <text x="130" y="246">P(gesund) = 0,99</text>
    <text x="490" y="36">P(positiv | krank) = 0,99</text>
    <text x="490" y="130">P(negativ | krank) = 0,01</text>
    <text x="490" y="196">P(positiv | gesund) = 0,05</text>
    <text x="490" y="290">P(negativ | gesund) = 0,95</text>
  </g>
  <g fill="#888" stroke="none" font-weight="bold">
    <text x="296" y="96">krank</text>
    <text x="296" y="256">gesund</text>
    <text x="630" y="45">positiv</text>
    <text x="630" y="145">negativ</text>
    <text x="630" y="205">positiv</text>
    <text x="630" y="305">negativ</text>
  </g>
  <g fill="#888" stroke="none">
    <text x="710" y="45">⇒ P(krank ∩ positiv) = 0,01 · 0,99 = 0,0099</text>
    <text x="710" y="145">⇒ P(krank ∩ negativ) = 0,01 · 0,01 = 0,0001</text>
    <text x="710" y="205">⇒ P(gesund ∩ positiv) = 0,99 · 0,05 = 0,0495</text>
    <text x="710" y="305">⇒ P(gesund ∩ negativ) = 0,99 · 0,95 = 0,9405</text>
  </g>
</svg>
