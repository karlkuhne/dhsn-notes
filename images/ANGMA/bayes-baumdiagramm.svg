<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="sans-serif" font-size="15" fill="none" stroke="#888" stroke-width="1.5">
  <g stroke="#888">
    <line x1="40" y1="170" x2="190" y2="80"/>
    <line x1="40" y1="170" x2="190" y2="260"/>
    <line x1="230" y1="80" x2="360" y2="40"/>
    <line x1="230" y1="80" x2="360" y2="120"/>
    <line x1="230" y1="260" x2="360" y2="220"/>
    <line x1="230" y1="260" x2="360" y2="300"/>
  </g>
  <g fill="#888" stroke="none" text-anchor="middle">
    <text x="85" y="108">P(A)</text>
    <text x="85" y="245">P(Ā)</text>
    <text x="270" y="44">P(B | A)</text>
    <text x="270" y="130">P(B̄ | A)</text>
    <text x="270" y="224">P(B | Ā)</text>
    <text x="270" y="314">P(B̄ | Ā)</text>
  </g>
  <g fill="#888" stroke="none" font-weight="bold">
    <text x="205" y="86">A</text>
    <text x="205" y="266">Ā</text>
    <text x="368" y="45">B</text>
    <text x="368" y="125">B̄</text>
    <text x="368" y="225">B</text>
    <text x="368" y="305">B̄</text>
  </g>
  <g fill="#888" stroke="none">
    <text x="395" y="45">⇒ P(A ∩ B) = P(A) · P(B | A)</text>
    <text x="395" y="125">⇒ P(A ∩ B̄) = P(A) · P(B̄ | A)</text>
    <text x="395" y="225">⇒ P(Ā ∩ B) = P(Ā) · P(B | Ā)</text>
    <text x="395" y="305">⇒ P(Ā ∩ B̄) = P(Ā) · P(B̄ | Ā)</text>
  </g>
</svg>
