<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="sans-serif" font-size="13">
  <!-- Übertragungsmedien: Balken über der Frequenzachse (x = 110 + i*55, i = 0..13) -->
  <rect x="330" y="20" width="275" height="26" rx="6" fill="#3aa675" fill-opacity="0.22" stroke="#3aa675" stroke-width="1.5"/>
  <text x="467" y="38" text-anchor="middle" fill="#3aa675" font-weight="bold" font-size="13">Funk</text>

  <rect x="495" y="54" width="110" height="26" rx="6" fill="#7a6ad8" fill-opacity="0.22" stroke="#7a6ad8" stroke-width="1.5"/>
  <text x="550" y="72" text-anchor="middle" fill="#7a6ad8" font-weight="bold" font-size="13">Hohlleiter</text>

  <rect x="759" y="54" width="44" height="26" rx="6" fill="#c9569a" fill-opacity="0.22" stroke="#c9569a" stroke-width="1.5"/>
  <text x="753" y="72" text-anchor="end" fill="#c9569a" font-weight="bold" font-size="13">optische Übertragung</text>

  <rect x="220" y="88" width="247" height="26" rx="6" fill="#e08a2e" fill-opacity="0.22" stroke="#e08a2e" stroke-width="1.5"/>
  <text x="343" y="106" text-anchor="middle" fill="#e08a2e" font-weight="bold" font-size="13">Koaxialkabel</text>

  <rect x="110" y="122" width="357" height="26" rx="6" fill="#3b82c4" fill-opacity="0.22" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="288" y="140" text-anchor="middle" fill="#3b82c4" font-weight="bold" font-size="13">verdrillte Drähte (Twisted Pair)</text>

  <!-- Frequenzachse -->
  <line x1="100" y1="175" x2="840" y2="175" stroke="#8a8f98" stroke-width="2"/>
  <polygon points="840,175 830,170 830,180" fill="#8a8f98"/>
  <g stroke="#8a8f98" stroke-width="1.5">
    <line x1="110" y1="168" x2="110" y2="182"/><line x1="165" y1="170" x2="165" y2="180"/>
    <line x1="220" y1="168" x2="220" y2="182"/><line x1="275" y1="170" x2="275" y2="180"/>
    <line x1="330" y1="168" x2="330" y2="182"/><line x1="385" y1="170" x2="385" y2="180"/>
    <line x1="440" y1="168" x2="440" y2="182"/><line x1="495" y1="170" x2="495" y2="180"/>
    <line x1="550" y1="168" x2="550" y2="182"/><line x1="605" y1="170" x2="605" y2="180"/>
    <line x1="660" y1="168" x2="660" y2="182"/><line x1="715" y1="170" x2="715" y2="180"/>
    <line x1="770" y1="168" x2="770" y2="182"/><line x1="825" y1="170" x2="825" y2="180"/>
  </g>

  <text x="8" y="202" fill="#8a8f98" font-size="11" font-weight="bold">Frequenz</text>
  <text x="8" y="220" fill="#8a8f98" font-size="11" font-weight="bold">Wellenlänge</text>
  <g fill="#8a8f98" font-size="12" text-anchor="middle">
    <text x="110" y="202">300 Hz</text><text x="110" y="220">1 Mm</text>
    <text x="220" y="202">30 kHz</text><text x="220" y="220">10 km</text>
    <text x="330" y="202">3 MHz</text><text x="330" y="220">100 m</text>
    <text x="440" y="202">300 MHz</text><text x="440" y="220">1 m</text>
    <text x="550" y="202">30 GHz</text><text x="550" y="220">1 cm</text>
    <text x="660" y="202">3 THz</text><text x="660" y="220">100 µm</text>
    <text x="770" y="202">300 THz</text><text x="770" y="220">1 µm</text>
  </g>

  <!-- Bänder -->
  <g fill="#8a8f98" fill-opacity="0.15" stroke="#8a8f98" stroke-width="1.5">
    <rect x="165" y="245" width="55" height="38"/><rect x="220" y="245" width="55" height="38"/>
    <rect x="275" y="245" width="55" height="38"/><rect x="330" y="245" width="55" height="38"/>
    <rect x="385" y="245" width="55" height="38"/><rect x="440" y="245" width="55" height="38"/>
    <rect x="495" y="245" width="55" height="38"/><rect x="550" y="245" width="55" height="38"/>
  </g>
  <rect x="605" y="245" width="165" height="38" fill="#d1495b" fill-opacity="0.18" stroke="#d1495b" stroke-width="1.5"/>
  <rect x="770" y="245" width="33" height="38" fill="#a3a33a" fill-opacity="0.3" stroke="#a3a33a" stroke-width="1.5"/>
  <rect x="803" y="245" width="22" height="38" fill="#7a6ad8" fill-opacity="0.22" stroke="#7a6ad8" stroke-width="1.5"/>
  <g fill="#8a8f98" font-weight="bold" font-size="13" text-anchor="middle">
    <text x="192" y="269">VLF</text><text x="247" y="269">LF</text><text x="302" y="269">MF</text>
    <text x="357" y="269">HF</text><text x="412" y="269">VHF</text><text x="467" y="269">UHF</text>
    <text x="522" y="269">SHF</text><text x="577" y="269">EHF</text>
  </g>
  <text x="687" y="269" text-anchor="middle" fill="#d1495b" font-weight="bold" font-size="13">Infrarot</text>
  <text x="786" y="303" text-anchor="middle" fill="#a3a33a" font-weight="bold" font-size="12">sichtbares Licht</text>
  <text x="814" y="269" text-anchor="middle" fill="#7a6ad8" font-weight="bold" font-size="11">UV</text>
  <line x1="786" y1="285" x2="786" y2="292" stroke="#a3a33a" stroke-width="1.5"/>
  <text x="440" y="320" text-anchor="middle" fill="#8a8f98" font-size="12">Je höher die Frequenz, desto kürzer die Wellenlänge</text>
</svg>
