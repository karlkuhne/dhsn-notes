<text x="535" y="205" text-anchor="middle" fill="#8a8f98" font-size="12">("DSL-Modem")</text>
<line x1="22" y1="120" x2="148" y2="120" stroke="#8a8f98" stroke-width="2" marker-end="url(#a)"/>
