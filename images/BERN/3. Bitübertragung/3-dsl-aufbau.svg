<rect x="150" y="60" width="170" height="120" rx="8" fill="#2f9fb8" fill-opacity="0.16" stroke="#2f9fb8" stroke-width="1.8"/><text x="235.0" y="114.0" text-anchor="middle" fill="#2f9fb8" font-weight="bold" font-size="14">DSL-Netzeinheit</text><text x="235.0" y="134.0" text-anchor="middle" fill="#8a8f98" font-size="12">DSLAM</text>
