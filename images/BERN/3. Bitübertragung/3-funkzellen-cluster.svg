<line x1="235.0" y1="238.0" x2="218.0" y2="267.4" stroke="#d1495b" stroke-width="2.5"/>
<text x="208.0" y="281.4" text-anchor="middle" fill="#d1495b" font-weight="bold" font-size="16">R</text>
<text x="235" y="34" text-anchor="middle" fill="#8a8f98" font-weight="bold" font-size="14">grauer Rahmen = ein Cluster (k = 7)</text>
<rect x="500" y="40" width="265" height="130" rx="8" fill="#3b82c4" fill-opacity="0.12" stroke="#3b82c4" stroke-width="1.5"/>
<text x="632" y="82" text-anchor="middle" fill="#3b82c4" font-weight="bold" font-size="22">D = R · √(3k)</text>
<text x="514" y="108" fill="#8a8f98" font-size="12">D: Abstand gleicher Frequenzen</text>
<text x="514" y="128" fill="#8a8f98" font-size="12">R: Zellradius (Mitte bis Ecke)</text>
<text x="514" y="148" fill="#8a8f98" font-size="12">k: Zellen pro Cluster</text>
<rect x="500" y="190" width="265" height="120" rx="8" fill="#8a8f98" fill-opacity="0.1" stroke="#8a8f98" stroke-width="1.5"/>
<text x="514" y="214" fill="#8a8f98" font-size="12" font-weight="bold">So liest man die Grafik:</text>
<text x="514" y="234" fill="#8a8f98" font-size="12">Gleiche Zahl = gleiche Frequenz.</text>
<text x="514" y="254" fill="#8a8f98" font-size="12">Ein Cluster nutzt jede Frequenz genau</text>
<text x="514" y="274" fill="#8a8f98" font-size="12">einmal und wiederholt sich wie Kacheln.</text>
<rect x="500" y="330" width="265" height="80" rx="8" fill="#3aa675" fill-opacity="0.12" stroke="#3aa675" stroke-width="1.5"/>
<text x="632" y="356" text-anchor="middle" fill="#3aa675" font-weight="bold" font-size="13">Beispiel k = 7</text>
<text x="632" y="380" text-anchor="middle" fill="#8a8f98" font-size="13">D = R · √21 ≈ 4,6 · R</text>
<text x="632" y="398" text-anchor="middle" fill="#8a8f98" font-size="12">(rote Strecke in der Grafik)</text>
</svg>