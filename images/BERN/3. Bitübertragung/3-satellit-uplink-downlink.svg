<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="pfeilo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e08a2e"/>
    </marker>
    <marker id="pfeilb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82c4"/>
    </marker>
  </defs>

  <!-- Satellit -->
  <rect x="290" y="30" width="100" height="44" rx="8" fill="#8a8f98" fill-opacity="0.25" stroke="#8a8f98" stroke-width="2"/>
  <rect x="215" y="40" width="65" height="24" fill="#3b82c4" fill-opacity="0.3" stroke="#3b82c4" stroke-width="1.5"/>
  <rect x="400" y="40" width="65" height="24" fill="#3b82c4" fill-opacity="0.3" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="340" y="57" text-anchor="middle" fill="#8a8f98" font-weight="bold" font-size="13">Transponder</text>
  <text x="340" y="20" text-anchor="middle" fill="#8a8f98" font-size="12">empfängt, verstärkt, sendet auf anderer Frequenz zurück</text>

  <!-- Uplink / Downlink -->
  <line x1="110" y1="260" x2="280" y2="82" stroke="#e08a2e" stroke-width="3" marker-end="url(#pfeilo)"/>
  <line x1="400" y1="82" x2="570" y2="260" stroke="#3b82c4" stroke-width="3" marker-end="url(#pfeilb)"/>
  <text x="135" y="150" text-anchor="middle" fill="#e08a2e" font-weight="bold" font-size="15">Uplink</text>
  <text x="135" y="168" text-anchor="middle" fill="#8a8f98" font-size="12">6 oder 14 GHz</text>
  <text x="545" y="150" text-anchor="middle" fill="#3b82c4" font-weight="bold" font-size="15">Downlink</text>
  <text x="545" y="168" text-anchor="middle" fill="#8a8f98" font-size="12">4 oder 12 GHz</text>

  <!-- Bodenstationen -->
  <g fill="none" stroke="#8a8f98" stroke-width="3" stroke-linecap="round">
    <path d="M75,255 Q105,300 135,255"/>
    <line x1="105" y1="285" x2="105" y2="310"/>
    <line x1="85" y1="310" x2="125" y2="310"/>
    <path d="M545,255 Q575,300 605,255"/>
    <line x1="575" y1="285" x2="575" y2="310"/>
    <line x1="555" y1="310" x2="595" y2="310"/>
  </g>
  <text x="105" y="335" text-anchor="middle" fill="#8a8f98" font-weight="bold" font-size="14">Station A</text>
  <text x="575" y="335" text-anchor="middle" fill="#8a8f98" font-weight="bold" font-size="14">Station B</text>

  <!-- Hinweis -->
  <rect x="215" y="215" width="250" height="70" rx="8" fill="#3aa675" fill-opacity="0.12" stroke="#3aa675" stroke-width="1.5"/>
  <text x="340" y="239" text-anchor="middle" fill="#3aa675" font-weight="bold" font-size="13">GEO: ca. 36 000 km Höhe</text>
  <text x="340" y="259" text-anchor="middle" fill="#8a8f98" font-size="12">hoch + runter = ca. 72 000 km</text>
  <text x="340" y="277" text-anchor="middle" fill="#8a8f98" font-size="12">Laufzeit ca. 0,24 s</text>
</svg>
