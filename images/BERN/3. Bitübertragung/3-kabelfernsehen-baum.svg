<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/>
    </marker>
  </defs>

  <!-- Kopfende -->
  <rect x="200" y="20" width="240" height="44" rx="8" fill="#3b82c4" fill-opacity="0.14" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="320" y="40" text-anchor="middle" fill="#3b82c4" font-weight="bold" font-size="14">Kopfende</text>
  <text x="320" y="56" text-anchor="middle" fill="#8a8f98" font-size="12">empfängt die TV-Programme</text>

  <!-- Verstärker -->
  <g fill="#3aa675" fill-opacity="0.16" stroke="#3aa675" stroke-width="1.5">
    <rect x="60" y="130" width="140" height="40" rx="8"/>
    <rect x="250" y="130" width="140" height="40" rx="8"/>
    <rect x="440" y="130" width="140" height="40" rx="8"/>
  </g>
  <g fill="#3aa675" font-weight="bold" font-size="14" text-anchor="middle">
    <text x="130" y="155">Verstärker</text>
    <text x="320" y="155">Verstärker</text>
    <text x="510" y="155">Verstärker</text>
  </g>

  <!-- Pfeile Kopfende -> Verstärker -->
  <g stroke="#8a8f98" stroke-width="2" marker-end="url(#pfeil)">
    <line x1="270" y1="66" x2="140" y2="126"/>
    <line x1="320" y1="66" x2="320" y2="126"/>
    <line x1="370" y1="66" x2="500" y2="126"/>
  </g>

  <!-- Pfeile Verstärker -> Teilnehmer -->
  <g stroke="#8a8f98" stroke-width="2" marker-end="url(#pfeil)">
    <line x1="105" y1="172" x2="85" y2="238"/><line x1="155" y1="172" x2="175" y2="238"/>
    <line x1="295" y1="172" x2="275" y2="238"/><line x1="345" y1="172" x2="365" y2="238"/>
    <line x1="485" y1="172" x2="465" y2="238"/><line x1="535" y1="172" x2="555" y2="238"/>
  </g>

  <!-- Teilnehmer -->
  <g fill="#e08a2e" fill-opacity="0.25" stroke="#e08a2e" stroke-width="1.5">
    <circle cx="80" cy="258" r="18"/><circle cx="180" cy="258" r="18"/>
    <circle cx="270" cy="258" r="18"/><circle cx="370" cy="258" r="18"/>
    <circle cx="460" cy="258" r="18"/><circle cx="560" cy="258" r="18"/>
  </g>
  <text x="320" y="302" text-anchor="middle" fill="#8a8f98" font-size="12">Teilnehmer: alle bekommen dasselbe Signal, unterwegs wird es mehrfach verstärkt</text>
</svg>
