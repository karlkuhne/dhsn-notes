<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" font-family="sans-serif" font-size="13">
  <!-- Mantel -->
  <rect x="30" y="30" width="110" height="230" rx="16" fill="#8a8f98" fill-opacity="0.2" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="85" y="284" text-anchor="middle" fill="#8a8f98" font-weight="bold" font-size="14">Mantel</text>

  <!-- vier Adernpaare, jeweils zwei ineinander gewickelte Adern -->
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M140,62 q15,-12 30,0 t30,0 t30,0 t30,0 t30,0 t30,0" stroke="#e08a2e"/>
    <path d="M140,62 q15,12 30,0 t30,0 t30,0 t30,0 t30,0 t30,0" stroke="#e08a2e" stroke-opacity="0.45"/>
    <path d="M140,115 q15,-12 30,0 t30,0 t30,0 t30,0 t30,0 t30,0" stroke="#3b82c4"/>
    <path d="M140,115 q15,12 30,0 t30,0 t30,0 t30,0 t30,0 t30,0" stroke="#3b82c4" stroke-opacity="0.45"/>
    <path d="M140,168 q15,-12 30,0 t30,0 t30,0 t30,0 t30,0 t30,0" stroke="#3aa675"/>
    <path d="M140,168 q15,12 30,0 t30,0 t30,0 t30,0 t30,0 t30,0" stroke="#3aa675" stroke-opacity="0.45"/>
    <path d="M140,221 q15,-12 30,0 t30,0 t30,0 t30,0 t30,0 t30,0" stroke="#8d6e63"/>
    <path d="M140,221 q15,12 30,0 t30,0 t30,0 t30,0 t30,0 t30,0" stroke="#8d6e63" stroke-opacity="0.45"/>
  </g>

  <!-- Beschriftung -->
  <line x1="330" y1="115" x2="368" y2="115" stroke="#8a8f98" stroke-width="1.5"/>
  <circle cx="330" cy="115" r="3" fill="#8a8f98"/>
  <text x="376" y="112" fill="#8a8f98" font-weight="bold" font-size="14">Adernpaar</text>
  <text x="376" y="130" fill="#8a8f98" font-size="12">zwei Adern, ca. 1 mm stark</text>

  <rect x="376" y="170" width="226" height="86" rx="8" fill="#3b82c4" fill-opacity="0.12" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="489" y="194" text-anchor="middle" fill="#3b82c4" font-weight="bold" font-size="14">Warum verdrillt?</text>
  <text x="489" y="216" text-anchor="middle" fill="#8a8f98" font-size="12">Eine Störung trifft beide Adern</text>
  <text x="489" y="234" text-anchor="middle" fill="#8a8f98" font-size="12">fast gleich und hebt sich auf.</text>
</svg>
