<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/>
    </marker>
  </defs>

  <!-- Quelle / Senke -->
  <rect x="20" y="20" width="280" height="42" rx="8" fill="#8a8f98" fill-opacity="0.12" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="160" y="46" text-anchor="middle" fill="#8a8f98" font-weight="bold" font-size="14">Tx · Quelle: Sprache oder Daten</text>
  <rect x="460" y="20" width="280" height="42" rx="8" fill="#8a8f98" fill-opacity="0.12" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="600" y="46" text-anchor="middle" fill="#8a8f98" font-weight="bold" font-size="14">Rx · Senke: Lautsprecher, Rechner</text>
  <line x1="160" y1="64" x2="160" y2="78" stroke="#8a8f98" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="600" y1="78" x2="600" y2="64" stroke="#8a8f98" stroke-width="2" marker-end="url(#pfeil)"/>


  <!-- Tx-Kette (orange), Reihen y = 80, 152, 224, 296, 368, 440 -->
  <rect x="20" y="80" width="280" height="58" rx="8" fill="#e08a2e" fill-opacity="0.14" stroke="#e08a2e" stroke-width="1.5"/>
  <text x="160" y="104" text-anchor="middle" fill="#e08a2e" font-weight="bold" font-size="14">1. ADC: analog zu digital</text>
  <text x="160" y="124" text-anchor="middle" fill="#8a8f98" font-size="12">Sprache wird zu Bits (entfällt bei Daten)</text>

  <rect x="20" y="152" width="280" height="58" rx="8" fill="#e08a2e" fill-opacity="0.14" stroke="#e08a2e" stroke-width="1.5"/>
  <text x="160" y="176" text-anchor="middle" fill="#e08a2e" font-weight="bold" font-size="14">2. Quellcodierung</text>
  <text x="160" y="196" text-anchor="middle" fill="#8a8f98" font-size="12">Komprimieren: Überflüssiges weglassen</text>

  <rect x="20" y="224" width="280" height="58" rx="8" fill="#e08a2e" fill-opacity="0.14" stroke="#e08a2e" stroke-width="1.5"/>
  <text x="160" y="248" text-anchor="middle" fill="#e08a2e" font-weight="bold" font-size="14">3. Kanalcodierung</text>
  <text x="160" y="268" text-anchor="middle" fill="#8a8f98" font-size="12">Prüfbits dazu: Fehler werden erkennbar</text>

  <rect x="20" y="296" width="280" height="58" rx="8" fill="#e08a2e" fill-opacity="0.14" stroke="#e08a2e" stroke-width="1.5"/>
  <text x="160" y="320" text-anchor="middle" fill="#e08a2e" font-weight="bold" font-size="14">4. Bandspreizung</text>
  <text x="160" y="340" text-anchor="middle" fill="#8a8f98" font-size="12">Signal auf ein breiteres Band verteilen</text>

  <rect x="20" y="368" width="280" height="58" rx="8" fill="#e08a2e" fill-opacity="0.14" stroke="#e08a2e" stroke-width="1.5"/>
  <text x="160" y="392" text-anchor="middle" fill="#e08a2e" font-weight="bold" font-size="14">5. Impulsformung</text>
  <text x="160" y="412" text-anchor="middle" fill="#8a8f98" font-size="12">Bits in Signalimpulse umwandeln</text>

  <rect x="20" y="440" width="280" height="58" rx="8" fill="#e08a2e" fill-opacity="0.14" stroke="#e08a2e" stroke-width="1.5"/>
  <text x="160" y="464" text-anchor="middle" fill="#e08a2e" font-weight="bold" font-size="14">6. Modulation</text>
  <text x="160" y="484" text-anchor="middle" fill="#8a8f98" font-size="12">Signal auf eine Trägerfrequenz setzen</text>

  <line x1="160" y1="140" x2="160" y2="150" stroke="#8a8f98" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="160" y1="212" x2="160" y2="222" stroke="#8a8f98" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="160" y1="284" x2="160" y2="294" stroke="#8a8f98" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="160" y1="356" x2="160" y2="366" stroke="#8a8f98" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="160" y1="428" x2="160" y2="438" stroke="#8a8f98" stroke-width="2" marker-end="url(#pfeil)"/>

  <!-- Rx-Kette (blau), umgekehrte Reihenfolge, gleiche Reihen -->
  <rect x="460" y="80" width="280" height="58" rx="8" fill="#3b82c4" fill-opacity="0.14" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="600" y="104" text-anchor="middle" fill="#3b82c4" font-weight="bold" font-size="14">DAC: digital zu analog</text>
  <text x="600" y="124" text-anchor="middle" fill="#8a8f98" font-size="12">Bits werden wieder zu Sprache</text>

  <rect x="460" y="152" width="280" height="58" rx="8" fill="#3b82c4" fill-opacity="0.14" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="600" y="176" text-anchor="middle" fill="#3b82c4" font-weight="bold" font-size="14">Quelldecodierung</text>
  <text x="600" y="196" text-anchor="middle" fill="#8a8f98" font-size="12">Wieder entpacken</text>

  <rect x="460" y="224" width="280" height="58" rx="8" fill="#3b82c4" fill-opacity="0.14" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="600" y="248" text-anchor="middle" fill="#3b82c4" font-weight="bold" font-size="14">Kanaldecodierung</text>
  <text x="600" y="268" text-anchor="middle" fill="#8a8f98" font-size="12">Fehler erkennen und korrigieren</text>

  <rect x="460" y="296" width="280" height="58" rx="8" fill="#3b82c4" fill-opacity="0.14" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="600" y="320" text-anchor="middle" fill="#3b82c4" font-weight="bold" font-size="14">Entspreizung</text>
  <text x="600" y="340" text-anchor="middle" fill="#8a8f98" font-size="12">Verteiltes Signal wieder bündeln</text>

  <rect x="460" y="368" width="280" height="58" rx="8" fill="none" stroke="#8a8f98" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="600" y="402" text-anchor="middle" fill="#8a8f98" font-size="12">kein eigener Schritt (laut Folie)</text>

  <rect x="460" y="440" width="280" height="58" rx="8" fill="#3b82c4" fill-opacity="0.14" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="600" y="464" text-anchor="middle" fill="#3b82c4" font-weight="bold" font-size="14">Demodulation</text>
  <text x="600" y="484" text-anchor="middle" fill="#8a8f98" font-size="12">Träger entfernen, Signal zurückholen</text>

  <line x1="600" y1="438" x2="600" y2="428" stroke="#8a8f98" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="600" y1="366" x2="600" y2="356" stroke="#8a8f98" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="600" y1="294" x2="600" y2="284" stroke="#8a8f98" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="600" y1="222" x2="600" y2="212" stroke="#8a8f98" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="600" y1="150" x2="600" y2="140" stroke="#8a8f98" stroke-width="2" marker-end="url(#pfeil)"/>

  <text x="380" y="200" text-anchor="middle" fill="#8a8f98" font-size="12">Rx macht jeden Schritt</text>
  <text x="380" y="218" text-anchor="middle" fill="#8a8f98" font-size="12">in umgekehrter Reihenfolge</text>

  <!-- Kanal -->
  <rect x="330" y="384" width="100" height="114" rx="8" fill="#3aa675" fill-opacity="0.16" stroke="#3aa675" stroke-width="2"/>
  <text x="380" y="410" text-anchor="middle" fill="#3aa675" font-weight="bold" font-size="14">Kanal</text>
  <text x="380" y="430" text-anchor="middle" fill="#8a8f98" font-size="12">Kabel + Antenne</text>
  <text x="380" y="450" text-anchor="middle" fill="#8a8f98" font-size="12">oder Funk</text>
  <path d="M345,470 q8,-10 16,0 t16,0 t16,0" fill="none" stroke="#3aa675" stroke-width="2"/>
  <text x="380" y="490" text-anchor="middle" fill="#8a8f98" font-size="11">Rauschen, Echo</text>
  <line x1="302" y1="469" x2="328" y2="469" stroke="#8a8f98" stroke-width="2" marker-end="url(#pfeil)"/>
  <line x1="432" y1="469" x2="458" y2="469" stroke="#8a8f98" stroke-width="2" marker-end="url(#pfeil)"/>
</svg>
