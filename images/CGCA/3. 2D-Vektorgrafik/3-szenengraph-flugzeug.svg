<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 370" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a8f98"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e08a2e"/></marker>
  </defs>

  <!-- Kanten: Pfad zum Propeller hervorgehoben -->
  <line x1="209" y1="90" x2="161" y2="159" stroke="#8a8f98" stroke-width="2" marker-end="url(#g)"/>
  <line x1="140" y1="226" x2="140" y2="287" stroke="#8a8f98" stroke-width="2" marker-end="url(#g)"/>
  <line x1="255" y1="86" x2="316" y2="158" stroke="#e08a2e" stroke-width="3" marker-end="url(#o)"/>

  <!-- Knoten -->
  <circle cx="230" cy="60" r="36" fill="#3b82c4" fill-opacity="0.15" stroke="#3b82c4" stroke-width="2"/>
  <text x="230" y="65" text-anchor="middle" fill="#8a8f98" font-weight="bold">T<tspan dy="4" font-size="10">Airpl</tspan></text>
  <circle cx="140" cy="190" r="36" fill="#3b82c4" fill-opacity="0.15" stroke="#3b82c4" stroke-width="2"/>
  <text x="140" y="195" text-anchor="middle" fill="#8a8f98" font-weight="bold">T<tspan dy="4" font-size="10">Prop</tspan></text>
  <rect x="270" y="160" width="110" height="60" fill="#8a8f98" fill-opacity="0.12" stroke="#8a8f98" stroke-width="2"/>
  <text x="325" y="196" text-anchor="middle" fill="#8a8f98" font-weight="bold">Airplane</text>
  <rect x="90" y="290" width="100" height="50" fill="#8a8f98" fill-opacity="0.12" stroke="#8a8f98" stroke-width="2"/>
  <text x="140" y="320" text-anchor="middle" fill="#8a8f98" font-weight="bold">Propeller</text>

  <!-- Pfad-Beschriftung -->
  <text x="300" y="30" fill="#e08a2e" font-weight="bold">Pfad zum Flugzeug:</text>
  <text x="300" y="52" fill="#e08a2e">P<tspan dy="3" font-size="10">Welt</tspan><tspan dy="-3"> = T</tspan><tspan dy="3" font-size="10">Airpl</tspan><tspan dy="-3"> · P</tspan><tspan dy="3" font-size="10">Airpl</tspan></text>
  <text x="300" y="72" fill="#8a8f98" font-size="11">Punkt am Flugzeug → Welt</text>

  <!-- Legende -->
  <circle cx="285" cy="294" r="9" fill="#3b82c4" fill-opacity="0.15" stroke="#3b82c4" stroke-width="2"/>
  <text x="302" y="299" fill="#8a8f98" font-size="12">Transformationsgruppe (innerer Knoten)</text>
  <rect x="276" y="318" width="18" height="14" fill="#8a8f98" fill-opacity="0.12" stroke="#8a8f98" stroke-width="2"/>
  <text x="302" y="330" fill="#8a8f98" font-size="12">Geometrie (Blatt)</text>
</svg>
