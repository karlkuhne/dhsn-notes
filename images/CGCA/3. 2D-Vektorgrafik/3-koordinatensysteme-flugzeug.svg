  <text x="400" y="285" fill="#e08a2e" font-weight="bold" font-size="13">T<tspan dy="3" font-size="9">P</tspan><tspan dy="-3"> = T</tspan><tspan dy="3" font-size="9">Airpl</tspan><tspan dy="-3"> · T</tspan><tspan dy="3" font-size="9">Prop</tspan></text>
