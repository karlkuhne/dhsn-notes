<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 235" font-family="sans-serif" font-size="12">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a8f98"/></marker>
  </defs>

  <!-- Schritt 1: Drehpunkt in den Ursprung verschieben -->
  <g>
    <text x="115" y="20" text-anchor="middle" fill="#8a8f98" font-weight="bold">1. T(−x₀, −y₀)</text>
    <line x1="30" y1="200" x2="215" y2="200" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#g)"/>
    <line x1="30" y1="200" x2="30" y2="35" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#g)"/>
    <rect x="110" y="84" width="60" height="36" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="108" y1="118" x2="36" y2="194" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#g)"/>
    <rect x="30" y="164" width="60" height="36" fill="#3b82c4" fill-opacity="0.25" stroke="#3b82c4" stroke-width="2"/>
    <circle cx="110" cy="120" r="4" fill="#e08a2e"/>
    <circle cx="30" cy="200" r="4" fill="#e08a2e"/>
    <text x="118" y="138" fill="#8a8f98">(x₀, y₀)</text>
  </g>

  <!-- Schritt 2: Rotation um den Ursprung -->
  <g transform="translate(230,0)">
    <text x="115" y="20" text-anchor="middle" fill="#8a8f98" font-weight="bold">2. R(α)</text>
    <line x1="30" y1="200" x2="215" y2="200" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#g)"/>
    <line x1="30" y1="200" x2="30" y2="35" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#g)"/>
    <rect x="30" y="164" width="60" height="36" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="30" y="164" width="60" height="36" transform="rotate(-35 30 200)" fill="#3b82c4" fill-opacity="0.25" stroke="#3b82c4" stroke-width="2"/>
    <path d="M62 200 A32 32 0 0 0 56.2 181.6" fill="none" stroke="#e08a2e" stroke-width="1.5"/>
    <text x="70" y="192" fill="#e08a2e" font-weight="bold">α</text>
    <circle cx="30" cy="200" r="4" fill="#e08a2e"/>
  </g>

  <!-- Schritt 3: zurückverschieben -->
  <g transform="translate(460,0)">
    <text x="115" y="20" text-anchor="middle" fill="#8a8f98" font-weight="bold">3. T(x₀, y₀)</text>
    <line x1="30" y1="200" x2="215" y2="200" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#g)"/>
    <line x1="30" y1="200" x2="30" y2="35" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#g)"/>
    <rect x="30" y="164" width="60" height="36" transform="rotate(-35 30 200)" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="34" y1="196" x2="106" y2="124" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#g)"/>
    <rect x="30" y="164" width="60" height="36" transform="translate(80,-80) rotate(-35 30 200)" fill="#3b82c4" fill-opacity="0.25" stroke="#3b82c4" stroke-width="2"/>
    <circle cx="30" cy="200" r="4" fill="#e08a2e"/>
    <circle cx="110" cy="120" r="4" fill="#e08a2e"/>
    <text x="124" y="140" fill="#8a8f98">(x₀, y₀)</text>
  </g>
</svg>
