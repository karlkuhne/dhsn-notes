<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a8f98"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e08a2e"/></marker>
  </defs>

  <!-- Kanten des Szenengraphen (Pfeilrichtung: von oben nach unten) -->
  <line x1="230" y1="81" x2="171" y2="158" stroke="#8a8f98" stroke-width="2" marker-end="url(#g)"/>
  <line x1="290" y1="81" x2="349" y2="158" stroke="#8a8f98" stroke-width="2" marker-end="url(#g)"/>
  <line x1="140" y1="216" x2="140" y2="277" stroke="#8a8f98" stroke-width="2" marker-end="url(#g)"/>
  <line x1="380" y1="216" x2="380" y2="277" stroke="#8a8f98" stroke-width="2" marker-end="url(#g)"/>

  <!-- Knoten -->
  <circle cx="260" cy="60" r="36" fill="#3b82c4" fill-opacity="0.15" stroke="#3b82c4" stroke-width="2"/>
  <text x="260" y="65" text-anchor="middle" fill="#8a8f98" font-weight="bold">S</text>
  <circle cx="140" cy="180" r="36" fill="#3b82c4" fill-opacity="0.15" stroke="#3b82c4" stroke-width="2"/>
  <text x="140" y="185" text-anchor="middle" fill="#8a8f98" font-weight="bold">T<tspan dy="4" font-size="10">A1</tspan></text>
  <circle cx="380" cy="180" r="36" fill="#3b82c4" fill-opacity="0.15" stroke="#3b82c4" stroke-width="2"/>
  <text x="380" y="185" text-anchor="middle" fill="#8a8f98" font-weight="bold">T<tspan dy="4" font-size="10">A2</tspan></text>
  <rect x="90" y="280" width="100" height="50" fill="#8a8f98" fill-opacity="0.12" stroke="#8a8f98" stroke-width="2"/>
  <text x="140" y="310" text-anchor="middle" fill="#8a8f98" font-weight="bold">O<tspan dy="4" font-size="10">A1</tspan></text>
  <rect x="330" y="280" width="100" height="50" fill="#8a8f98" fill-opacity="0.12" stroke="#8a8f98" stroke-width="2"/>
  <text x="380" y="310" text-anchor="middle" fill="#8a8f98" font-weight="bold">O<tspan dy="4" font-size="10">A2</tspan></text>

  <!-- Weg des Punktes: hoch gegen die Kantenpfeile, runter mit ihnen -->
  <path d="M95 278 C60 220, 90 130, 224 74" fill="none" stroke="#e08a2e" stroke-width="3" stroke-dasharray="7 4" marker-end="url(#o)"/>
  <path d="M296 74 C430 130, 460 220, 425 278" fill="none" stroke="#e08a2e" stroke-width="3" stroke-dasharray="7 4" marker-end="url(#o)"/>
  <text x="8" y="96" fill="#e08a2e" font-weight="bold" font-size="13">1. hoch: T<tspan dy="3" font-size="9">A1</tspan></text>
  <text x="8" y="114" fill="#e08a2e" font-size="12">gegen die Pfeile</text>
  <text x="512" y="96" text-anchor="end" fill="#e08a2e" font-weight="bold" font-size="13">2. runter: T<tspan dy="3" font-size="9">A2</tspan><tspan dy="-6" font-size="9">-1</tspan></text>
  <text x="512" y="114" text-anchor="end" fill="#e08a2e" font-size="12">mit den Pfeilen</text>

  <!-- Pfad-Beschriftung -->
  <text x="260" y="365" text-anchor="middle" fill="#e08a2e" font-weight="bold">Punkt von Flugzeug 1 in Koordinaten von Flugzeug 2:</text>
  <text x="260" y="390" text-anchor="middle" fill="#e08a2e">P<tspan dy="3" font-size="10">A1</tspan><tspan dy="3" font-size="8">A2</tspan><tspan dy="-6"> = T</tspan><tspan dy="3" font-size="10">A2</tspan><tspan dy="-8" font-size="10">-1</tspan><tspan dy="5"> · T</tspan><tspan dy="3" font-size="10">A1</tspan><tspan dy="-3"> · P</tspan><tspan dy="3" font-size="10">A1</tspan><tspan dy="3" font-size="8">A1</tspan></text>
  <!-- Legende -->
  <line x1="60" y1="430" x2="100" y2="430" stroke="#8a8f98" stroke-width="2" marker-end="url(#g)"/>
  <text x="108" y="434" fill="#8a8f98" font-size="12">Kante im Szenengraph</text>
  <line x1="290" y1="430" x2="330" y2="430" stroke="#e08a2e" stroke-width="3" stroke-dasharray="7 4" marker-end="url(#o)"/>
  <text x="338" y="434" fill="#e08a2e" font-size="12">Weg des Punktes</text>
</svg>
