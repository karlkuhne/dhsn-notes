<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="sans-serif" font-size="12">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a8f98"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e08a2e"/></marker>
  </defs>

  <!-- Window (Weltkoordinaten, y nach oben) -->
  <text x="150" y="20" text-anchor="middle" fill="#8a8f98" font-weight="bold">Window (Weltkoordinaten)</text>
  <line x1="40" y1="300" x2="275" y2="300" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#g)"/>
  <line x1="40" y1="300" x2="40" y2="45" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="280" y="304" fill="#8a8f98">x</text>
  <text x="44" y="42" fill="#8a8f98">y</text>
  <rect x="80" y="110" width="150" height="150" fill="#3b82c4" fill-opacity="0.1" stroke="#3b82c4" stroke-width="2"/>
  <polygon points="110,230 190,230 150,150" fill="#e08a2e" fill-opacity="0.45" stroke="#e08a2e" stroke-width="2"/>
  <circle cx="80" cy="260" r="4" fill="#3b82c4"/>
  <circle cx="230" cy="110" r="4" fill="#3b82c4"/>
  <text x="80" y="278" fill="#8a8f98">(x<tspan dy="3" font-size="9">min</tspan><tspan dy="-3">, y</tspan><tspan dy="3" font-size="9">min</tspan><tspan dy="-3">)</tspan></text>
  <text x="230" y="102" text-anchor="end" fill="#8a8f98">(x<tspan dy="3" font-size="9">max</tspan><tspan dy="-3">, y</tspan><tspan dy="3" font-size="9">max</tspan><tspan dy="-3">)</tspan></text>

  <!-- Abbildung G -->
  <line x1="245" y1="180" x2="335" y2="180" stroke="#e08a2e" stroke-width="2.5" marker-end="url(#o)"/>
  <text x="290" y="170" text-anchor="middle" fill="#e08a2e" font-weight="bold">G</text>
  <text x="290" y="199" text-anchor="middle" fill="#8a8f98" font-size="11">T · S · T</text>

  <!-- Viewport (Gerätekoordinaten, v nach unten) -->
  <text x="465" y="20" text-anchor="middle" fill="#8a8f98" font-weight="bold">Viewport (Gerätekoordinaten)</text>
  <line x1="350" y1="45" x2="585" y2="45" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#g)"/>
  <line x1="350" y1="45" x2="350" y2="315" stroke="#8a8f98" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="590" y="49" fill="#8a8f98">u</text>
  <text x="355" y="325" fill="#8a8f98">v</text>
  <rect x="390" y="80" width="170" height="190" fill="#3b82c4" fill-opacity="0.1" stroke="#3b82c4" stroke-width="2"/>
  <polygon points="424,232 515,232 469,131" fill="#e08a2e" fill-opacity="0.45" stroke="#e08a2e" stroke-width="2"/>
  <circle cx="390" cy="270" r="4" fill="#3b82c4"/>
  <circle cx="560" cy="80" r="4" fill="#3b82c4"/>
  <text x="390" y="288" fill="#8a8f98">(u<tspan dy="3" font-size="9">min</tspan><tspan dy="-3">, v</tspan><tspan dy="3" font-size="9">max</tspan><tspan dy="-3">)</tspan></text>
  <text x="560" y="72" text-anchor="end" fill="#8a8f98">(u<tspan dy="3" font-size="9">max</tspan><tspan dy="-3">, v</tspan><tspan dy="3" font-size="9">min</tspan><tspan dy="-3">)</tspan></text>
</svg>
