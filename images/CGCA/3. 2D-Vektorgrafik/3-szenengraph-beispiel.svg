<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 490" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a8f98"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e08a2e"/></marker>
  </defs>

  <!-- Kanten: Pfad zum Propeller hervorgehoben -->
  <line x1="230" y1="96" x2="230" y2="141" stroke="#e08a2e" stroke-width="3" marker-end="url(#o)"/>
  <line x1="209" y1="210" x2="161" y2="279" stroke="#e08a2e" stroke-width="3" marker-end="url(#o)"/>
  <line x1="140" y1="346" x2="140" y2="407" stroke="#e08a2e" stroke-width="3" marker-end="url(#o)"/>
  <line x1="255" y1="206" x2="316" y2="278" stroke="#8a8f98" stroke-width="2" marker-end="url(#g)"/>

  <!-- Knoten -->
  <circle cx="230" cy="60" r="36" fill="#3b82c4" fill-opacity="0.15" stroke="#3b82c4" stroke-width="2"/>
  <text x="230" y="65" text-anchor="middle" fill="#8a8f98" font-weight="bold">S</text>
  <circle cx="230" cy="180" r="36" fill="#3b82c4" fill-opacity="0.15" stroke="#3b82c4" stroke-width="2"/>
  <text x="230" y="185" text-anchor="middle" fill="#8a8f98" font-weight="bold">T<tspan dy="4" font-size="10">Airpl</tspan></text>
  <circle cx="140" cy="310" r="36" fill="#3b82c4" fill-opacity="0.15" stroke="#3b82c4" stroke-width="2"/>
  <text x="140" y="315" text-anchor="middle" fill="#8a8f98" font-weight="bold">T<tspan dy="4" font-size="10">Prop</tspan></text>
  <rect x="270" y="280" width="110" height="60" fill="#8a8f98" fill-opacity="0.12" stroke="#8a8f98" stroke-width="2"/>
  <text x="325" y="316" text-anchor="middle" fill="#8a8f98" font-weight="bold">O<tspan dy="4" font-size="10">Airpl</tspan></text>
  <rect x="90" y="410" width="100" height="50" fill="#8a8f98" fill-opacity="0.12" stroke="#8a8f98" stroke-width="2"/>
  <text x="140" y="440" text-anchor="middle" fill="#8a8f98" font-weight="bold">O<tspan dy="4" font-size="10">Prop</tspan></text>

  <!-- Beschriftung Wurzel -->
  <text x="285" y="52" fill="#8a8f98" font-size="12">2D-Welt (Wurzel)</text>

  <!-- Pfad-Beschriftung -->
  <text x="300" y="166" fill="#e08a2e" font-weight="bold">Pfad zum Propeller:</text>
  <text x="300" y="188" fill="#e08a2e">T<tspan dy="3" font-size="10">P</tspan><tspan dy="-3"> = T</tspan><tspan dy="3" font-size="10">Airpl</tspan><tspan dy="-3"> · T</tspan><tspan dy="3" font-size="10">Prop</tspan></text>

  <!-- Legende -->
  <circle cx="285" cy="414" r="9" fill="#3b82c4" fill-opacity="0.15" stroke="#3b82c4" stroke-width="2"/>
  <text x="302" y="419" fill="#8a8f98" font-size="12">Transformationsgruppe (innerer Knoten)</text>
  <rect x="276" y="438" width="18" height="14" fill="#8a8f98" fill-opacity="0.12" stroke="#8a8f98" stroke-width="2"/>
  <text x="302" y="450" fill="#8a8f98" font-size="12">Geometrie (Blatt)</text>
</svg>
