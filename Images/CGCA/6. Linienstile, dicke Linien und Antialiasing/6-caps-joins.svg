<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300" font-family="sans-serif" font-size="13">
<text x="20" y="22" fill="#8a8f98" font-weight="bold">Linienenden (caps) und -verbindungen (joins)</text>
<text x="20" y="48" fill="#8a8f98">Enden</text>
<line x1="60" y1="120" x2="60" y2="70" stroke="#3b82c4" stroke-width="26" stroke-linecap="butt" stroke-opacity="0.75"/>
<line x1="60" y1="120" x2="60" y2="70" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="60" y="150" text-anchor="middle" fill="#8a8f98" font-size="12">CAP_BUTT</text>
<line x1="190" y1="120" x2="190" y2="70" stroke="#3b82c4" stroke-width="26" stroke-linecap="round" stroke-opacity="0.75"/>
<line x1="190" y1="120" x2="190" y2="70" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="190" y="150" text-anchor="middle" fill="#8a8f98" font-size="12">CAP_ROUND</text>
<line x1="320" y1="120" x2="320" y2="70" stroke="#3b82c4" stroke-width="26" stroke-linecap="square" stroke-opacity="0.75"/>
<line x1="320" y1="120" x2="320" y2="70" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="320" y="150" text-anchor="middle" fill="#8a8f98" font-size="12">CAP_SQUARE</text>
<text x="20" y="180" fill="#8a8f98">Verbindungen</text>
<polyline points="30,190 60,240 90,190" fill="none" stroke="#3b82c4" stroke-width="22" stroke-linejoin="miter" stroke-miterlimit="10" stroke-opacity="0.75"/>
<polyline points="30,190 60,240 90,190" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="60" y="292" text-anchor="middle" fill="#8a8f98" font-size="12">JOIN_MITER</text>
<polyline points="160,190 190,240 220,190" fill="none" stroke="#3b82c4" stroke-width="22" stroke-linejoin="bevel" stroke-miterlimit="10" stroke-opacity="0.75"/>
<polyline points="160,190 190,240 220,190" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="190" y="292" text-anchor="middle" fill="#8a8f98" font-size="12">JOIN_BEVEL</text>
<polyline points="290,190 320,240 350,190" fill="none" stroke="#3b82c4" stroke-width="22" stroke-linejoin="round" stroke-miterlimit="10" stroke-opacity="0.75"/>
<polyline points="290,190 320,240 350,190" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="320" y="292" text-anchor="middle" fill="#8a8f98" font-size="12">JOIN_ROUND</text>
</svg>
